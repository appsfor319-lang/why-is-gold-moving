name: Deploy Gold Briefing Worker

concurrency:
  group: deploy-gold-briefing-worker-final-test-2
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy



      - name: Verify live GoldSquawk feed extraction
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url = "https://why-is-gold-movingm.appsfor319.workers.dev/api/goldsquawk-preview";
          let lastError = "No response";
          for (let attempt = 0; attempt < 6; attempt++) {
            try {
              const response = await fetch(url, { cache: "no-store", signal: AbortSignal.timeout(20000) });
              const body = await response.json();
              if (!response.ok) throw new Error("Preview HTTP " + response.status + ": " + (body.error || "unknown"));
              if (typeof body.why !== "string" || body.why.trim().length < 50) throw new Error("GoldSquawk explanation missing or too short");
              if (!Array.isArray(body.urgent)) throw new Error("Urgent-news extraction did not return an array");
              if (!body.checked_at) throw new Error("Feed check timestamp missing");
              console.log("GOLDSQUAWK_FEED=PASS");
              console.log(JSON.stringify({
                checked_at: body.checked_at,
                explanation_chars: body.why.length,
                explanation_preview: body.why.slice(0, 900),
                urgent_headlines_found: body.urgent.length,
                urgent_headlines: body.urgent
              }, null, 2));
              process.exit(0);
            } catch (error) {
              lastError = error?.message || String(error);
              if (attempt < 5) await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          throw new Error("GoldSquawk live feed verification failed: " + lastError);
          NODE

      - name: Verify real Telegram delivery
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url = "https://why-is-gold-movingm.appsfor319.workers.dev/api/telegram-test-status";
          let last = "No Telegram status response";
          for (let attempt = 0; attempt < 72; attempt++) {
            try {
              const response = await fetch(url, { cache: "no-store", signal: AbortSignal.timeout(10000) });
              const body = await response.json();
              if (!response.ok) throw new Error("Telegram status HTTP " + response.status);
              if (!body.configured) throw new Error("Telegram bot token or chat ID is missing in Cloudflare Worker secrets");
              if (body.status === "confirmed" && body.sent === true) {
                console.log("TELEGRAM_DELIVERY=CONFIRMED");
                console.log(JSON.stringify(body.result));
                process.exit(0);
              }
              if (body.status === "failed") throw new Error("Telegram delivery failed: " + (body.result?.error || "unknown Telegram API error"));
              last = "Waiting for the scheduled one-time Telegram delivery test";
            } catch (error) {
              last = error?.message || String(error);
              if (/missing in Cloudflare|Telegram delivery failed/.test(last)) throw error;
            }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw new Error("Telegram delivery was not confirmed within six minutes: " + last);
          NODE

      - name: Smoke test live GitHub Pages site
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = "https://appsfor319-lang.github.io/why-is-gold-moving/";
          let lastError = "No response from the published site";
          for (let attempt = 0; attempt < 24; attempt++) {
            try {
              const page = await fetch(base, { cache: "no-store", signal: AbortSignal.timeout(10000) });
              if (!page.ok) throw new Error("Homepage HTTP " + page.status);
              const html = await page.text();
              if (!html.includes("WHY IS GOLD MOVING?") || !html.includes("TradZ") || !html.includes("live-chart-panel")) {
                throw new Error("Homepage is missing the main title, TradZ branding or live chart panel");
              }
              const [appResponse, cssResponse] = await Promise.all([
                fetch(base + "app.js?v=chart1", { cache: "no-store", signal: AbortSignal.timeout(10000) }),
                fetch(base + "styles.css?v=lang3", { cache: "no-store", signal: AbortSignal.timeout(10000) })
              ]);
              if (!appResponse.ok || !cssResponse.ok) throw new Error("Published JavaScript or CSS asset did not load");
              const [app, css] = await Promise.all([appResponse.text(), cssResponse.text()]);
              if (!app.includes("g.change_period||'today'") || !app.includes("dir==='up'")) {
                throw new Error("Published app.js does not contain the latest gold-period and direction consistency fixes");
              }
              if (!css.includes(".hero-title") || !css.includes("@media(max-width:580px)")) {
                throw new Error("Published styles do not contain the large title and mobile responsive rules");
              }
              console.log("SITE_SMOKE_RESULT=PASS");
              console.log("Live GitHub Pages homepage, app.js and styles.css responded successfully; title and responsive markers verified.");
              process.exit(0);
            } catch (error) {
              lastError = error?.message || String(error);
              if (attempt < 23) await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          console.warn("SITE_SMOKE_RESULT=UNVERIFIED");
          console.warn("Live GitHub Pages check could not verify the current published assets: " + lastError);
          NODE
