name: Deploy Gold Briefing Worker

concurrency:
  group: deploy-gold-briefing-worker-final-test-2
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy



      - name: Smoke test live Worker API and data quality
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url = "https://why-is-gold-movingm.appsfor319.workers.dev/api/terminal";
          let lastError = "No response";
          for (let attempt = 0; attempt < 5; attempt++) {
            try {
              const response = await fetch(url, { cache: "no-store", signal: AbortSignal.timeout(25000) });
              const body = await response.json();
              if (!response.ok) throw new Error("API HTTP " + response.status + ": " + (body.error || "unknown"));
              if (!["ok", "partial"].includes(body.status)) throw new Error("Unexpected API status");
              if (!body.market || !body.market.gold || !body.briefing || typeof body.briefing.headline !== "string" || typeof body.briefing.body !== "string") {
                throw new Error("Required market or briefing fields are missing");
              }
              if (!Array.isArray(body.news) || !Array.isArray(body.calendar) || !Array.isArray(body.history) || !Array.isArray(body.intraday_history) || !Array.isArray(body.sources)) {
                throw new Error("News, calendar, history, intraday_history or source arrays are missing");
              }
              const validDate = value => {
                if (typeof value !== "string" || !/^\\d{4}-\\d{2}-\\d{2}$/.test(value)) return false;
                const date = new Date(value + "T00:00:00Z");
                return Number.isFinite(date.getTime()) && date.toISOString().slice(0, 10) === value;
              };
              const validUrl = value => { try { const u = new URL(value); return ["https:", "http:"].includes(u.protocol); } catch { return false; } };
              const invalidHistory = body.history.filter(row =>
                !validDate(row.date) ||
                !Number.isFinite(row.gold_event_day_pct) ||
                !Number.isFinite(row.gold_next_day_pct) ||
                !row.source || !validUrl(row.source_url) ||
                !row.event_source || !validUrl(row.event_source_url) || !row.method
              );
              if (invalidHistory.length) throw new Error("Historical event rows are missing valid dates, daily close returns or source/method metadata");
              const invalidIntraday = body.intraday_history.filter(row =>
                !row.release_at_utc || !Number.isFinite(Date.parse(row.release_at_utc)) ||
                !Number.isFinite(row.gold_15m_pct) ||
                !Number.isFinite(row.gold_1h_pct) ||
                !Number.isFinite(row.gold_4h_pct) ||
                !row.baseline_bar || !row.source || !validUrl(row.source_url) ||
                !row.event_source || !validUrl(row.event_source_url) || !row.method ||
                !Object.prototype.hasOwnProperty.call(row, "actual") ||
                !Object.prototype.hasOwnProperty.call(row, "forecast") ||
                !Object.prototype.hasOwnProperty.call(row, "previous")
              );
              if (invalidIntraday.length) throw new Error("Intraday event rows are missing release times, 15m/1h/4h returns or source/method metadata");
              const invalidCalendar = body.calendar.filter(row => {
                const date = String(row.datetime || "").slice(0, 10);
                return !validDate(date) || !row.event || !row.source || !validUrl(row.source_url);
              });
              if (invalidCalendar.length) throw new Error("Calendar rows are missing a valid date, event or source attribution");
              const intradaySource = body.sources.find(source => source.name === "Intraday event reactions");
              const financeCalendarConfigured = intradaySource?.status !== "not_configured";
              const calendarFieldCoverage = Object.fromEntries(["actual", "forecast", "previous"].map(field => [field, body.calendar.filter(row => row[field] !== null && row[field] !== undefined && row[field] !== "").length]));
              const calendarTimedRows = body.calendar.filter(row => /T\\d{2}:\\d{2}/.test(String(row.datetime || ""))).length;
              const expectedGoldDirection = body.market.gold.stale ? "unknown" : Number(body.market.gold.change_pct) > 0.05 ? "up" : Number(body.market.gold.change_pct) < -0.05 ? "down" : "flat";
              const briefingText = (body.briefing.headline + " " + body.briefing.body).toLowerCase();
              const directionConsistent = expectedGoldDirection === "unknown" ||
                (expectedGoldDirection === "up" && /higher|rising|rose|up/.test(briefingText)) ||
                (expectedGoldDirection === "down" && /lower|falling|fell|down/.test(briefingText)) ||
                (expectedGoldDirection === "flat" && /little changed|flat|unchanged|mixed|unclear/.test(briefingText));
              if (!body.sources.every(source => source && typeof source.name === "string" && typeof source.status === "string" && typeof source.freshness === "string")) {
                throw new Error("A source entry is missing its name, status or freshness");
              }
              if (body.news.length === 0) throw new Error("No current publisher headlines were returned");
              const chartResponse = await fetch("https://why-is-gold-movingm.appsfor319.workers.dev/api/chart?interval=5min", { cache: "no-store", signal: AbortSignal.timeout(25000) });
              const chart = await chartResponse.json();
              if (!chartResponse.ok || !Array.isArray(chart.candles) || chart.candles.length < 20 || chart.refresh_seconds !== 300) {
                throw new Error("Live five-minute chart data or its five-minute REST fallback metadata is invalid");
              }
              const invalidNews = body.news.filter(item => {
                if (!item.title || !item.source || !item.published_at || !item.url) return true;
                try {
                  const u = new URL(item.url);
                  return !["https:", "http:"].includes(u.protocol) || ["news.google.com", "goldsquawk.com", "www.goldsquawk.com"].includes(u.hostname);
                } catch { return true; }
              });
              if (invalidNews.length) throw new Error("A headline lacks an original-publisher link, source or publication timestamp");
              const stale = Object.entries(body.market).filter(([, value]) => value && (value.stale === true || value.freshness === "stale")).map(([name]) => name);
              if (stale.length && !/stale|excluded/i.test(body.briefing.body)) throw new Error("Stale market readings are not clearly excluded from the briefing");
              const publishers = [...new Set(body.news.map(item => item.source))];
              console.log("WORKER_API_SMOKE_RESULT=PASS");
              console.log(JSON.stringify({
                status: body.status,
                gold_change_pct: body.market.gold.change_pct,
                briefing_headline: body.briefing.headline,
                news_count: body.news.length,
                publisher_count: publishers.length,
                publishers,
                calendar_count: body.calendar.length,
                calendar_rows_with_release_time: calendarTimedRows,
                calendar_actual_forecast_prior_counts: calendarFieldCoverage,
                daily_history_count: body.history.length,
                latest_daily_history_date: body.history[0]?.date || null,
                latest_daily_history_sample: body.history.slice(0, 3),
                intraday_history_count: body.intraday_history.length,
                latest_intraday_history_sample: body.intraday_history.slice(0, 3),
                finance_calendar_configured: financeCalendarConfigured,
                ai: { engine: body.briefing.engine || null, model: body.briefing.model || null, status: body.briefing.ai_status || null, error: String(body.briefing.ai_error || "").slice(0, 180) || null },
                gold_direction: expectedGoldDirection,
                briefing_direction_consistent: directionConsistent,
                headlines: body.news.slice(0, 8).map(item => ({ title: item.title, source: item.source, published_at: item.published_at, url: item.url })),
                chart_source: chart.source,
                chart_candles: chart.candles.length,
                chart_fallback_refresh_seconds: chart.refresh_seconds,
                stale_market_fields: stale,
                source_statuses: body.sources.map(source => ({ name: source.name, status: source.status, freshness: source.freshness, timestamp: source.timestamp }))
              }, null, 2));
              process.exit(0);
            } catch (error) {
              lastError = error?.message || String(error);
              if (attempt < 4) await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          throw new Error("Live Worker API verification failed: " + lastError);
          NODE

      - name: Smoke test live GitHub Pages site
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = "https://appsfor319-lang.github.io/why-is-gold-moving/";
          let lastError = "No response from the published site";
          for (let attempt = 0; attempt < 24; attempt++) {
            try {
              const page = await fetch(base, { cache: "no-store", signal: AbortSignal.timeout(10000) });
              if (!page.ok) throw new Error("Homepage HTTP " + page.status);
              const html = await page.text();
              if (!html.includes("WHY IS GOLD MOVING?") || !html.includes("TradZ") || !html.includes("live-chart-panel")) {
                throw new Error("Homepage is missing the main title, TradZ branding or live chart panel");
              }
              const [appResponse, cssResponse] = await Promise.all([
                fetch(base + "app.js?v=chart2", { cache: "no-store", signal: AbortSignal.timeout(10000) }),
                fetch(base + "styles.css?v=chart3", { cache: "no-store", signal: AbortSignal.timeout(10000) })
              ]);
              if (!appResponse.ok || !cssResponse.ok) throw new Error("Published JavaScript or CSS asset did not load");
              const chartResponse = await fetch(base + "chart.js?v=ufd3", { cache: "no-store", signal: AbortSignal.timeout(10000) });
              if (!chartResponse.ok) throw new Error("Published chart.js did not load");
              const [app, css, chart] = await Promise.all([appResponse.text(), cssResponse.text(), chartResponse.text()]);
              if (!app.includes("g.change_period||'today'") || !app.includes("dir==='up'")) {
                throw new Error("Published app.js does not contain the latest gold-period and direction consistency fixes");
              }
              if (!app.includes("setInterval(refresh,900000)") || app.includes("setInterval(refresh,300000)")) {
                throw new Error("The briefing polling interval does not match the stated 15-minute update cycle");
              }
              if (!chart.includes("setInterval(()=>{if(!streamConnected)loadChart(false);},300000)")) {
                throw new Error("The chart fallback polling interval is not five minutes while live ticks are unavailable");
              }
              if (!chart.includes("connectLiveStream") || !chart.includes("applyLiveTick")) {
                throw new Error("Published chart.js is missing live tick-stream handlers");
              }
              if (!css.includes(".hero-title") || !css.includes("@media(max-width:580px)")) {
                throw new Error("Published styles do not contain the large title and mobile responsive rules");
              }
              console.log("SITE_SMOKE_RESULT=PASS");
              console.log("Live GitHub Pages homepage, app.js and styles.css responded successfully; title and responsive markers verified.");
              process.exit(0);
            } catch (error) {
              lastError = error?.message || String(error);
              if (attempt < 23) await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          console.warn("SITE_SMOKE_RESULT=UNVERIFIED");
          console.warn("Live GitHub Pages check could not verify the current published assets: " + lastError);
          NODE
