name: Deploy Gold Briefing Worker

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      - name: List configured Worker secret names only
        working-directory: worker
        shell: bash
        run: |
          npx wrangler secret list --format json | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{for(const x of JSON.parse(s))console.log(x.name)})'
      - name: Smoke test live terminal API
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url = "https://why-is-gold-movingm.appsfor319.workers.dev/api/terminal";
          const response = await fetch(url, { signal: AbortSignal.timeout(45000) });
          if (!response.ok) throw new Error("Terminal API returned HTTP " + response.status);
          const data = await response.json();
          for (const field of ["market", "briefing", "news", "calendar", "history", "intraday_history", "positioning", "sources"]) {
            if (!(field in data)) throw new Error("Missing API field: " + field);
          }
          if (!Array.isArray(data.news) || !Array.isArray(data.calendar) || !Array.isArray(data.sources) || !Array.isArray(data.history) || !Array.isArray(data.intraday_history)) {
            throw new Error("News, calendar and sources must be arrays");
          }
          if (!["gemini", "rules-fallback", "free-rules-analysis"].includes(data.briefing?.engine) || ![undefined, "ok", "fallback"].includes(data.briefing?.ai_status)) {
            throw new Error("Unexpected briefing engine state: " + (data.briefing?.engine || "unknown"));
          }
          const ai = data.sources.find(source => source.name === "Gemini AI analysis");
          if (!ai || !["ok", "fallback"].includes(ai.status)) throw new Error("AI source health check failed");
          const chartResponse = await fetch("https://why-is-gold-movingm.appsfor319.workers.dev/api/chart?interval=5min", { signal: AbortSignal.timeout(45000) });
          if (!chartResponse.ok) throw new Error("XAU/USD chart endpoint returned HTTP " + chartResponse.status);
          const chart = await chartResponse.json();
          if (chart.symbol !== "XAU/USD" || !Array.isArray(chart.candles) || chart.candles.length < 20 || !Array.isArray(chart.order_block_candles)) {
            throw new Error("XAU/USD chart endpoint returned incomplete candle data");
          }
          console.log("Chart smoke test: " + chart.candles.length + " XAU/USD 5m candles; " + chart.order_block_candles.length + " 1H candles.");
          const analysisResponse = await fetch("https://why-is-gold-movingm.appsfor319.workers.dev/api/chart-analysis", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ chart: { timeframe: "5min", last: { close: 4000 }, structure: { direction: "test structure" }, session: null, session_ranges: [], active_liquidity: [], recent_sweeps: [], order_blocks: [] }, market: {}, headlines: [] }),
            signal: AbortSignal.timeout(20000)
          });
          if (!analysisResponse.ok) throw new Error("Chart analysis endpoint returned HTTP " + analysisResponse.status);
          const chartAnalysis = await analysisResponse.json();
          if (typeof chartAnalysis.analysis?.headline !== "string" || typeof chartAnalysis.analysis?.body !== "string") {
            throw new Error("Chart analysis endpoint returned an invalid analysis object");
          }
          console.log("Chart analysis smoke test: engine=" + (chartAnalysis.analysis.engine || "unknown") + "; confidence=" + (chartAnalysis.analysis.confidence || "unknown"));

          console.log(JSON.stringify({
            api_status: data.status,
            ai_engine: data.briefing.engine,
            ai_status: data.briefing.ai_status,
            ai_model: data.briefing.model || null,
            ai_fallback_reason: data.briefing.ai_error || null,
            news_count: data.news.length,
            calendar_count: data.calendar.length,
            history_count: data.history.length,
            intraday_history_count: data.intraday_history.length,
            cftc_positioning: data.positioning ? { report_date: data.positioning.report_date, managed_money_net: data.positioning.managed_money_net, weekly_net_change: data.positioning.weekly_net_change } : null,
            source_health: data.sources.map(source => ({ name: source.name, status: source.status }))
          }, null, 2));
          NODE

      - name: Verify Telegram bot authentication
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --max-time 20 -X POST "https://why-is-gold-movingm.appsfor319.workers.dev/api/telegram-check?key=tradz-check-20261115-b9d74f"

