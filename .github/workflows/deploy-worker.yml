name: Deploy Gold Briefing Worker

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      - name: Smoke test live terminal API
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url = "https://why-is-gold-movingm.appsfor319.workers.dev/api/terminal";
          const response = await fetch(url, { signal: AbortSignal.timeout(45000) });
          if (!response.ok) throw new Error("Terminal API returned HTTP " + response.status);
          const data = await response.json();
          for (const field of ["market", "briefing", "news", "calendar", "history", "intraday_history", "positioning", "sources"]) {
            if (!(field in data)) throw new Error("Missing API field: " + field);
          }
          if (!Array.isArray(data.news) || !Array.isArray(data.calendar) || !Array.isArray(data.sources) || !Array.isArray(data.history) || !Array.isArray(data.intraday_history)) {
            throw new Error("News, calendar and sources must be arrays");
          }
          if (!["gemini", "rules-fallback"].includes(data.briefing?.engine) || !["ok", "fallback"].includes(data.briefing?.ai_status)) {
            throw new Error("Unexpected briefing engine state: " + (data.briefing?.engine || "unknown"));
          }
          const ai = data.sources.find(source => source.name === "Gemini AI analysis");
          if (!ai || !["ok", "fallback"].includes(ai.status)) throw new Error("AI source health check failed");
          console.log(JSON.stringify({
            api_status: data.status,
            ai_engine: data.briefing.engine,
            ai_status: data.briefing.ai_status,
            ai_model: data.briefing.model || null,
            ai_fallback_reason: data.briefing.ai_error || null,
            news_count: data.news.length,
            calendar_count: data.calendar.length,
            history_count: data.history.length,
            intraday_history_count: data.intraday_history.length,
            cftc_positioning: data.positioning ? { report_date: data.positioning.report_date, managed_money_net: data.positioning.managed_money_net, weekly_net_change: data.positioning.weekly_net_change } : null,
            source_health: data.sources.map(source => ({ name: source.name, status: source.status }))
          }, null, 2));
          NODE
