name: Refresh live gold research snapshot
on:
  push:
    branches: [main]
    paths:
      - scripts/refresh-live-research.js
      - .github/workflows/refresh-live-research.yml
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gold-research-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate updater JavaScript
        run: node --check scripts/refresh-live-research.js
      - name: Fetch market snapshot and refresh outlook JSON
        run: node scripts/refresh-live-research.js
      - name: Validate generated research JSON
        run: |
          node -e "for (const f of ['research/live-market-outlook.json','research/where-gold-going-latest.json']) { const d=JSON.parse(require('fs').readFileSync(f,'utf8')); if(!d.updated_at) throw new Error(f+' missing updated_at'); console.log('Valid:',f,d.updated_at); }"
      - name: Commit all generated research if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/*.json
          if git diff --cached --quiet; then
            echo "No generated research changes"
          else
            git commit -m "Refresh automated gold research and outlook"
            git push
          fi
