name: Refresh live gold research snapshot
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gold-research-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch free market quotes and headlines
        run: node scripts/refresh-live-research.js
      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/live-market-outlook.json
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Refresh live gold research snapshot"
            git push
          fi